name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Проверки (typecheck, тесты, сборка образа)
    runs-on: ubuntu-latest
    concurrency:
      group: ci-tests-${{ github.ref }}
      cancel-in-progress: true

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: church
          POSTGRES_PASSWORD: church
          POSTGRES_DB: church40
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U church -d church40"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://church:church@localhost:5433/church40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          # Два пакета — два lock-файла; без второго кэш не обновлялся бы
          # при смене зависимостей интерфейса.
          cache-dependency-path: |
            package-lock.json
            web/home-groups/package-lock.json

      - run: npm ci

      - name: Типы (tsc --noEmit)
        run: npm run typecheck

      - name: Сборка (tsc в dist/)
        run: npm run build

      - name: Тесты (vitest, живой Postgres)
        run: npm test

      # Интерфейс «Домашние группы» — отдельный пакет со своими зависимостями.
      # Его типы читают src/home-groups/contracts.ts, так что typecheck ловит
      # расхождение контракта между сервером и интерфейсом.
      - name: Интерфейс «Домашние группы» — зависимости
        working-directory: web/home-groups
        run: npm ci

      - name: Интерфейс «Домашние группы» — типы
        working-directory: web/home-groups
        run: npm run typecheck

      - name: Интерфейс «Домашние группы» — тесты
        working-directory: web/home-groups
        run: npm test

      - name: Интерфейс «Домашние группы» — сборка
        working-directory: web/home-groups
        run: npm run build

      # Прод-деплой (scripts/deploy.sh) собирает этот же Dockerfile прямо на
      # сервере — если он не соберётся, деплой упадёт уже после git pull.
      # Проверяем это здесь, до мержа.
      - name: Docker-образ собирается
        run: docker build -t church40bot:ci .

  deploy:
    name: Деплой на сервер
    needs: test
    # Деплоим только после мержа в main — не на каждый пуш в PR-ветку.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      # Без cancel-in-progress: если мерж случится второй раз, пока первый
      # деплой ещё выкладывается, второй дождётся очереди, а не оборвёт первый
      # на середине docker compose up.
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Загрузить SSH-ключ
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}

      - name: Запомнить ключ хоста
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_HOST_PORT }}" -H "${{ secrets.SSH_HOST_IP }}" >> ~/.ssh/known_hosts

      # git pull — прямо здесь, а не в scripts/deploy.sh: в первый раз, когда
      # deploy.sh ещё не лежит на сервере, git pull должен успеть его принести
      # до попытки запуска. Бэкап при деплое больше не делаем — теперь это
      # отдельный systemd-таймер на сервере (см. deploy/systemd/), а не шаг CI.
      #
      # Сам деплой идёт на сервере в фоне (scripts/deploy-detached.sh): сборка образов дольше пяти минут, и одна
      # долгая SSH-сессия обрывалась («Broken pipe») — CI краснел, хотя сервер доделывал выкладку. Теперь сессия
      # только запускает деплой, а дальше CI коротко опрашивает его (scripts/deploy-status.sh), печатает журнал и
      # ждёт кода завершения. Оборванный опрос просто повторяется.
      - name: git pull, выкладка bot → dashboard → home-groups
        env:
          SSH_PORT: ${{ secrets.SSH_HOST_PORT }}
          SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST_IP }}
          DEPLOY_PATH: ${{ secrets.SSH_DEPLOY_PATH }}
        run: |
          remote() { ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o ConnectTimeout=20 -p "$SSH_PORT" "$SSH_TARGET" "$@"; }
          SHA="$(remote "set -eu; cd '$DEPLOY_PATH'; git pull --ff-only origin main >&2; ./scripts/deploy-detached.sh")"
          echo "деплой $SHA запущен на сервере, жду итога"
          FROM=0
          # 120 опросов по 15 секунд — полчаса: столько сборка не идёт даже на холодном кэше.
          for i in $(seq 1 120); do
            sleep 15
            if ! OUT="$(remote "cd '$DEPLOY_PATH' && ./scripts/deploy-status.sh '$SHA' $FROM")"; then
              echo "::warning::нет связи с сервером, опрошу снова"
              continue
            fi
            HEAD="$(printf '%s\n' "$OUT" | head -n 1)"
            printf '%s\n' "$OUT" | tail -n +2
            SIZE="$(echo "$HEAD" | cut -d' ' -f2)"
            CODE="$(echo "$HEAD" | cut -d' ' -f3)"
            FROM="$SIZE"
            if [ "$CODE" != "-" ]; then
              [ "$CODE" = "0" ] && exit 0
              echo "::error::deploy.sh завершился с кодом $CODE — журнал выше и на сервере в deploy-logs/$SHA.log"
              exit 1
            fi
          done
          echo "::error::деплой $SHA не закончился за 30 минут — смотрите deploy-logs/$SHA.log на сервере"
          exit 1
