services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-church}:${POSTGRES_PASSWORD:-church}@db:5432/${POSTGRES_DB:-church40}
      TZ: ${TIMEZONE:-Europe/Moscow}
    depends_on:
      db:
        condition: service_healthy
    # Российские хостинги часто режут api.telegram.org: DNS отдаёт адрес, который молча
    # таймаутит. Поэтому имя хоста прибиваем к живому IP — SNI и проверка сертификата
    # при этом работают штатно, потому что имя остаётся telegram-овым.
    # Как найти рабочий адрес, если бот перестал подключаться, — см. README.
    extra_hosts:
      - 'api.telegram.org:${TELEGRAM_API_IP:-149.154.167.220}'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-church}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-church}
      POSTGRES_DB: ${POSTGRES_DB:-church40}
      TZ: ${TIMEZONE:-Europe/Moscow}
    volumes:
      # Postgres 18 ждёт монтирование на /var/lib/postgresql (данные лежат в подкаталоге версии),
      # иначе контейнер уходит в перезапуск. Так же работает pg_upgrade между мажорными версиями.
      - pgdata:/var/lib/postgresql
    # Порт наружу не публикуем: бот и дашборд ходят к базе по внутренней сети compose.
    # Для локальной разработки поднимайте базу профилем dev (см. README).
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-church} -d ${POSTGRES_DB:-church40}']
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # Сессии дашборда. Свой контейнер, ни с чьим сайтом не общий — раньше делили Valkey
  # соседнего стека через внешнюю сеть, но это работало только пока оба жили на одном
  # сервере. Один инстанс, никакого пароля наружу не торчит (порт не публикуется).
  valkey:
    image: valkey/valkey:7.2-alpine
    restart: unless-stopped
    volumes:
      - valkeydata:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # Дашборд статистики: вход по паролю, сессии в Valkey.
  # Тот же образ, что и бот, просто другая команда.
  dashboard:
    build: .
    restart: unless-stopped
    command: node dist/dashboard/index.js
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-church}:${POSTGRES_PASSWORD:-church}@db:5432/${POSTGRES_DB:-church40}
      REDIS_URL: redis://valkey:6379/0
      DASHBOARD_HTML: /app/dashboard/home-groups.html
      TZ: ${TIMEZONE:-Europe/Moscow}
    # По умолчанию только localhost — снаружи должен стоять nginx (или другой
    # reverse proxy) с доменом и TLS. Открыть порт наружу напрямую (без домена,
    # обычным http) — задать DASHBOARD_BIND=0.0.0.0 в .env; тогда обязательно
    # поставить и DASHBOARD_COOKIE_SECURE=false, иначе браузер не отправит куку
    # сессии обратно по незашифрованному соединению и вход не сохранится.
    ports:
      - '${DASHBOARD_BIND:-127.0.0.1}:8090:8090'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # Новый интерфейс «Домашние группы» (этап A): React-страница и JSON API в одном процессе.
  # Тот же образ, что и бот, просто другая команда. Живёт параллельно со старым
  # дашбордом, его не заменяет: своя кука (mbv_sid), свой порт, а база, Valkey и
  # пароли общие — вход прежний. Новых обязательных переменных нет.
  # Выкладывается после dashboard (см. scripts/deploy.sh): схему базы накатывает бот.
  home-groups:
    build: .
    restart: unless-stopped
    command: node dist/home-groups/index.js
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-church}:${POSTGRES_PASSWORD:-church}@db:5432/${POSTGRES_DB:-church40}
      REDIS_URL: redis://valkey:6379/0
      # Собранный интерфейс, см. стадию web в Dockerfile.
      HG_WEB_DIR: /app/web-dist
      # Внутри контейнера порт зафиксирован и не зависит от .env: env_file сюда
      # тоже попадает, а значение из environment его перекрывает. Так healthcheck
      # и правая часть публикации порта ниже всегда сходятся.
      HG_PORT: 8092
      TZ: ${TIMEZONE:-Europe/Moscow}
    # Меняется только порт на хосте: HG_PORT в .env задаёт, куда обращаться снаружи
    # (слева), а внутри контейнера всегда 8092 (справа). Правила про DASHBOARD_BIND
    # те же, что у dashboard: по умолчанию только localhost, снаружи нужен nginx с
    # TLS; при DASHBOARD_BIND=0.0.0.0 без домена обязательно DASHBOARD_COOKIE_SECURE=false.
    ports:
      - '${DASHBOARD_BIND:-127.0.0.1}:${HG_PORT:-8092}:8092'
    # busybox wget есть в alpine, ставить curl ради проверки не нужно.
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8092/health >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  pgdata:
  valkeydata:
